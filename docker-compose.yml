volumes:
  postgres-data:
    name: emma-and-elea-postgres-data

networks:
  postgres-network:

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: emma_and_elea
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emma_and_elea"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - postgres-network

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/emma_and_elea?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - postgres-network
    restart: "no"

  emma-and-elea:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/emma_and_elea?schema=public
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/api/auth/ok || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - postgres-network
    restart: unless-stopped
